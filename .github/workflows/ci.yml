name: Test and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lupa==2.8
      - run: python tests/test_addon.py
      - shell: pwsh
        run: |
          ./scripts/package.ps1
          ./scripts/package.ps1 -Client Retail
          ./scripts/package.ps1 -Client 335
      - uses: actions/upload-artifact@v4
        with:
          name: FamiliarFaces-install-packages
          path: dist/*.zip
